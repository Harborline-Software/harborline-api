name: platform-feed-producer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-feed-producer-main
  cancel-in-progress: false

jobs:
  produce-linux:
    if: github.repository == 'Harborline-Software/harborline-api' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # Definition and tools come from this protected-main workflow, never a PR checkout.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read reviewed platform pin
        id: pin
        run: echo "commit=$(node -p "JSON.parse(require('fs').readFileSync('eng/platform-pin.json')).commit")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Harborline-Software/harborline-platform
          ref: ${{ steps.pin.outputs.commit }}
          path: .platform
          persist-credentials: false
          fetch-depth: 0
      - name: Feed contracts
        run: node --test eng/tests/platform-feed-reuse.test.mjs eng/tests/same-job-platform-feed.test.mjs
      - name: Build isolated feed
        shell: bash --noprofile --norc -p -e -o pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_OPTIONS: ''
          NODE_PATH: ''
          NODE_REPL_EXTERNAL_MODULE: ''
          NODE_DISABLE_COMPILE_CACHE: '1'
          NODE_PRESERVE_SYMLINKS: ''
          NODE_ICU_DATA: ''
          NODE_COMPILE_CACHE: ''
          NODE_COMPILE_CACHE_PORTABLE: ''
          NODE_DEBUG: ''
          NODE_DEBUG_NATIVE: ''
          NODE_REDIRECT_WARNINGS: ''
          NODE_V8_COVERAGE: ''
          NODE_TLS_REJECT_UNAUTHORIZED: ''
          OPENSSL_CONF: ''
          OPENSSL_CONF_INCLUDE: ''
          OPENSSL_MODULES: ''
          OPENSSL_ENGINES: ''
          LD_AUDIT: ''
          LD_ORIGIN_PATH: ''
          GCONV_PATH: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          DYLD_FRAMEWORK_PATH: ''
          DYLD_FALLBACK_LIBRARY_PATH: ''
          DYLD_FALLBACK_FRAMEWORK_PATH: ''
          BASH_ENV: ''
          ENV: ''
        run: |
          export NODE_DISABLE_COMPILE_CACHE=1
          unset NODE_OPTIONS NODE_PATH NODE_REPL_EXTERNAL_MODULE NODE_PRESERVE_SYMLINKS NODE_ICU_DATA NODE_COMPILE_CACHE NODE_COMPILE_CACHE_PORTABLE NODE_DEBUG NODE_DEBUG_NATIVE NODE_REDIRECT_WARNINGS NODE_V8_COVERAGE NODE_TLS_REJECT_UNAUTHORIZED OPENSSL_CONF OPENSSL_CONF_INCLUDE OPENSSL_MODULES OPENSSL_ENGINES LD_AUDIT LD_ORIGIN_PATH GCONV_PATH LD_PRELOAD LD_LIBRARY_PATH DYLD_INSERT_LIBRARIES DYLD_LIBRARY_PATH DYLD_FRAMEWORK_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_FALLBACK_FRAMEWORK_PATH BASH_ENV ENV
          node eng/platform-feed-reuse.mjs produce "$GITHUB_WORKSPACE/.platform"
      - name: Dependency artifact
        uses: actions/upload-artifact@v7
        with:
          name: platform-feed-linux-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true # only the explicit bundle file is selected
          path: .claude/platform-feed-producer/feed-bundle.json
