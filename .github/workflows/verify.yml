# verify: required API lanes run on GitHub-hosted macOS and the existing Windows and perf runners.
# Fork and draft guards still protect the self-hosted lanes; the required aggregator remains unconditional.
name: verify

on:
  # T-577: no push-to-main run. The merge group already proved the exact commit that lands, so a
  # push run would be the third full measurement of one tree. Required contexts still run on
  # pull_request because the queue admits a PR only after its required checks pass on the PR itself.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: '17 6 * * *'   # nightly Windows datapoint against main (verify-windows below)
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

jobs:
  verify-shared:
    if: >-
      vars.ACTIONS_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'merge_group' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false))
    # The shared lane reads no host-specific baseline.
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      # quality and quality-baseline are NOT in this lane: they read the SARIF that exact-clone
      # writes, and exact-clone runs on the hosts. HARBORLINE_GATE_QUALITY therefore lives on
      # verify-windows below, which is the one host that carries the comparison.
      HARBORLINE_VERIFY_LANE: shared
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - name: Runner identity
        shell: bash
        run: echo "Runner ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Read the quality pin
        id: quality_pin
        run: echo "commit=$(jq -r '.commit' eng/quality-pin.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: Harborline-Software/harborline-control
          ref: main
          path: .control
          token: ${{ secrets.HARBORLINE_PINS_TOKEN }}

      - uses: actions/checkout@v7
        with:
          repository: Harborline-Software/harborline-quality
          ref: ${{ steps.quality_pin.outputs.commit }}
          path: .quality
          token: ${{ secrets.HARBORLINE_PINS_TOKEN }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - name: Ensure Rust toolchain
        run: rustup show active-toolchain >/dev/null 2>&1 || rustup default stable

      - uses: ./.github/actions/platform-feed

      - name: Use pinned checkouts
        run: |
          mv .platform "$RUNNER_TEMP/harborline-platform"
          ln -s "$RUNNER_TEMP/harborline-platform" .platform
          printf '.control/\n.quality/\n.platform\n' >> .git/info/exclude
          echo "HARBORLINE_CONTROL_REPO=$GITHUB_WORKSPACE/.control" >> "$GITHUB_ENV"
          echo "HARBORLINE_QUALITY_REPO=$GITHUB_WORKSPACE/.quality" >> "$GITHUB_ENV"
          echo "HARBORLINE_PLATFORM_REPO=$GITHUB_WORKSPACE/.platform" >> "$GITHUB_ENV"

      - name: eng/verify.sh
        run: bash eng/verify.sh

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .git/harborline-api-verify-receipt.json
            .git/harborline-api-quality-decision.json
            .claude/gate-evidence/
            .claude/gate-evidence/*.trx
            artifacts/quality/

  verify:
    # T-633: the required context. Deliberately unconditional (`always()`), so neither the kill
    # switch nor a fork head nor a failed dependency can leave it skipped-and-therefore-green. It
    # passes only when every job in `needs` reports success; a skipped lane fails it.
    # T-578: the host lanes are in `needs`, so one required context carries all three lanes and a
    # red verify-windows or verify-macos blocks the pull request and ejects it from the merge queue.
    # Before this, only the shared lane was required and PR 175 landed with both host lanes red.
    needs: [verify-shared, verify-macos, verify-windows, verify-perf]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every lane this context stands for ran and passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "::error::draft PR: self-hosted lanes are not run; mark ready for review to verify"
            exit 1
          fi
          echo "$NEEDS"
          jq -e 'del(.["verify-perf"]) | all(.[]; .result == "success")' <<< "$NEEDS" >/dev/null || { echo "::error::a lane the verify context stands for did not succeed"; exit 1; }
          # verify-perf (Q38, T-724 ruling 9): success, or skipped because PERF_HOST_OFFLINE_SINCE says
          # mac16 is offline -- for at most 72 hours after that instant, after which the skip fails.
          perf=$(jq -r '.["verify-perf"].result' <<< "$NEEDS")
          if [ "$perf" = "success" ]; then exit 0; fi
          since="${{ vars.PERF_HOST_OFFLINE_SINCE }}"
          if [ "$perf" != "skipped" ] || [ -z "$since" ]; then
            echo "::error::verify-perf did not succeed (result: $perf)"
            exit 1
          fi
          since_s=$(date -u -d "$since" +%s) || { echo "::error::PERF_HOST_OFFLINE_SINCE is not a date: $since"; exit 1; }
          age_h=$(( ($(date -u +%s) - since_s) / 3600 ))
          if [ "$age_h" -lt 0 ]; then
            echo "::error::PERF_HOST_OFFLINE_SINCE is in the future ($since); a future instant cannot extend the 72h skip"
            exit 1
          fi
          if [ "$age_h" -ge 72 ]; then
            echo "::error::verify-perf has been skipped since $since (${age_h}h, limit 72h): mac16 (perf-quiet) must come back, or the owner rules again"
            exit 1
          fi
          echo "::warning::verify-perf skipped: mac16 (perf-quiet) marked offline since $since (${age_h}h of the 72h allowed); the Layout timing-parity tests did not run"

  verify-perf:
    # Owner ruling Q38 (T-724 rulings 7 to 9, T-268 option A): the wall-clock timing-parity tests
    # (trait Lane=perf, the LayoutTimingParity collection) run here, alone, on mac16's one perf-quiet
    # registration, and no host lane runs them (eng/run-exact-clone.mjs filters Lane!=perf). One runner
    # registration runs one job at a time, so nothing shares the box with these samples. Nobody runs
    # anything on mac16 by hand (ruling 8).
    #
    # When mac16 is offline, set the repository variable PERF_HOST_OFFLINE_SINCE to the UTC instant it
    # went down (for example 2026-09-26T04:00:00Z). This job is then skipped, the `verify` aggregator
    # says so, and it fails once the skip is 72 hours old (ruling 9). Clear the variable when mac16
    # returns. The workflow token cannot read runner status, so the variable is set by hand; while it
    # is unset and mac16 is down, this job waits for the runner and `verify` waits with it.
    #
    # T-662: the fork guard, character for character the one the other lanes carry.
    if: >-
      vars.ACTIONS_ENABLED == 'true' &&
      vars.PERF_HOST_OFFLINE_SINCE == '' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'merge_group' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false))
    runs-on: [self-hosted, macOS, X64, mac16, perf-quiet]
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - name: Runner identity
        shell: bash
        run: |
          echo "Runner ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - name: Resolve the host pin directories
        run: |
          lanes="$HOME/Projects/Harborline/lanes"
          echo "HARBORLINE_PLATFORM_REPO=$lanes/platform-pin" >> "$GITHUB_ENV"

      - name: Refresh the platform pin
        run: |
          pin=$(node -e "console.log(JSON.parse(require('fs').readFileSync('eng/platform-pin.json','utf8')).commit)")
          if [ ! -d "$HARBORLINE_PLATFORM_REPO/.git" ]; then git clone -q https://github.com/Harborline-Software/harborline-platform.git "$HARBORLINE_PLATFORM_REPO"; fi
          git -C "$HARBORLINE_PLATFORM_REPO" cat-file -e "$pin^{commit}" 2>/dev/null || git -C "$HARBORLINE_PLATFORM_REPO" fetch -q origin
          git -C "$HARBORLINE_PLATFORM_REPO" checkout -q --detach "$pin" && git -C "$HARBORLINE_PLATFORM_REPO" clean -fdxq
          echo "platform $pin"

      - name: Build the local platform feed
        run: |
          node eng/build-local-feed.mjs

      - name: Perf lane (Lane=perf, alone on this host)
        run: |
          set -o pipefail
          mkdir -p .claude/gate-evidence
          dotnet test apps/local-node-host/tests/tests.csproj -c Release --nologo -nodeReuse:false             --filter "Lane=perf"             --logger "trx;LogFileName=perf-tests.trx" --results-directory .claude/gate-evidence             --logger "console;verbosity=detailed"             -- RunConfiguration.TreatNoTestsAsError=true | tee .claude/gate-evidence/perf-tests.log
          echo "## Layout timing parity (KS)" >> "$GITHUB_STEP_SUMMARY"
          grep -E "KS D = " .claude/gate-evidence/perf-tests.log | sed -E 's/^ *(\[xUnit[^]]*\] *)?//' | sort -u | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-perf-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .claude/gate-evidence/

  # The two host lanes. Each runs exact-clone against its own baseline, in parallel with the shared
  # lane, and since T-578 each is on the landing's critical path through the `verify` aggregator.
  verify-macos:
    # The macOS half of the host lane. Before ticket 421 this ran inside `verify` only because that
    # job happened to be pinned to a Mac; now the shared lane floats across runners, so the macOS
    # host suite needs a job of its own or a shared lane that landed on Windows would silently stop
    # running it. Its baseline permits six failures where the Windows one permits zero -- four of
    # those are T-425 and T-426, not facilities macOS lacks.
    #
    # T-662: the fork guard, character for character the one verify-shared carries above. A fork
    # pull request does not start this job, so it does not run its author's code on our Mac.
    if: >-
      vars.ACTIONS_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'merge_group' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false))
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
      HARBORLINE_VERIFY_LANE: host
    steps:
      - name: Runner identity
        shell: bash
        run: echo "Runner ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: ./.github/actions/platform-feed

      - name: Use pinned platform
        run: |
          echo '.platform/' >> .git/info/exclude
          echo "HARBORLINE_PLATFORM_REPO=$GITHUB_WORKSPACE/.platform" >> "$GITHUB_ENV"

      - name: Host lane (exact-clone against this host's baseline)
        run: bash eng/verify.sh

      # T-724 ruling 119e: report-only, nightly only -- never runs against a pull request, so it can
      # never block one, and it never writes anything (the fix is a reviewed --write-known-tests
      # commit, not a workflow auto-commit). A red step here means a merged PR added or removed a
      # host or capability test without a knownTests refresh in the same PR.
      - name: Nightly known-tests drift report
        if: always() && github.event_name == 'schedule'
        run: node eng/known-tests-drift.mjs .claude/gate-evidence/known-tests-candidate.json

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-macos-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .git/harborline-api-verify-receipt.json
            .claude/gate-evidence/

  verify-windows:
    # The cross-platform half of the gate: the host and capability suites against the WINDOWS
    # baseline, and nothing else.
    #
    # Ticket 421. This job used to run eng/verify.sh end to end -- which is exactly what the macOS
    # `verify` job above does -- so thirteen of its fifteen steps produced the same answer twice per
    # event. boundaries, identity-r3, both codegen steps, contracts TypeScript / C# / Rust,
    # localfirst, rule-engine, operator-cli-headless, quality, quality-baseline and packages do not
    # read the host: the same cargo build, the same pnpm install and the same quality comparison ran
    # on both machines. Only exact-clone answers differently, because it selects its baseline from
    # uname -s. Each landing paid that duplication three times -- the pull-request run, the
    # merge-queue run, and main's own push run.
    #
    # The shared steps now run once, in `verify`; this job keeps the part that is genuinely its own.
    # Both host suites still run, in parallel, against their own baselines -- Windows permits zero
    # failures where macOS permits six -- and neither host waits for the other.
    #
    # Deliberately gone from this job: the quality-baseline fetch (its step no longer runs here, and
    # the fetch can wait 600s for an artifact nothing would read) and the Rust toolchain install (the
    # clone gate builds no Rust; contracts-rust is a shared step).
    #
    # T-662: the fork guard, character for character the one verify-shared carries above. A fork
    # pull request does not start this job, so it does not run its author's code on winbox. The
    # nightly schedule datapoint is unaffected -- `schedule` is the first disjunct.
    if: >-
      vars.ACTIONS_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'merge_group' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false))
    runs-on: [self-hosted, Windows, winbox]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      NUGET_PACKAGES: C:\nuget-runner
      # 339 s4 / 2026-09-10: without this the roslyn SARIF is never produced and the quality step
      # compares an empty set. Coverage stays with the merge-queue run only (2026-09-08 ruling).
      # Ticket 421: exactly ONE host sets this, so the quality comparison happens once per event
      # however many hosts run the suite. verify-macos deliberately does not.
      HARBORLINE_GATE_QUALITY: '1'
      HARBORLINE_GATE_COVERAGE: ${{ github.event_name == 'merge_group' && '1' || '' }}
    steps:
      - name: Git Bash on PATH for the service account
        # Only C:\Program Files\Git\cmd is on the machine PATH; bash.exe lives in ...\Git\bin.
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'

      - name: Runner identity
        # After the PATH step: bash is not on the service account's PATH until it runs.
        shell: bash
        run: echo "Runner ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - name: pnpm for the runner account, once
        # The capability suite inside the clone gate runs under vitest. Nothing here builds Rust.
        run: |
          command -v pnpm >/dev/null 2>&1 || npm install -g pnpm@10
          echo "$APPDATA\npm" >> "$GITHUB_PATH"

      - name: Host pins (fresh clones under the runner account; public over HTTPS)
        run: |
          lanes="$USERPROFILE/Projects/Harborline/lanes"; mkdir -p "$lanes"
          [ -d "$lanes/platform-pin/.git" ] || git clone -q https://github.com/Harborline-Software/harborline-platform.git "$lanes/platform-pin"
          plat="$lanes/platform-pin"; echo "HARBORLINE_PLATFORM_REPO=$plat" >> "$GITHUB_ENV"
          # control and quality are private: with HARBORLINE_PINS_TOKEN they are cloned and refreshed here.
          # Dependabot pull requests never see repo secrets, so without the token the runner account's
          # already-seeded clones stand in -- identity-r3 is not skippable and needs a control checkout.
          if [ -n "${{ secrets.HARBORLINE_PINS_TOKEN }}" ]; then
            for r in control-gh:harborline-control quality-pin:harborline-quality; do
              d="$lanes/${r%%:*}"; [ -d "$d/.git" ] || git clone -q "https://x-access-token:${{ secrets.HARBORLINE_PINS_TOKEN }}@github.com/Harborline-Software/${r##*:}.git" "$d"
              git -C "$d" fetch -q origin
            done
          fi
          # This job never detached the quality clone, so it read whatever commit the directory was
          # left at. verify-shared used to be unlabelled and land on this host too, detaching this
          # same directory ($HOME and $USERPROFILE are one path here) to ITS tree's pin -- so the pin
          # from whichever run went last leaked into the next one's boundary check. Measured: PR #203
          # pins ced797c2 and logged "quality-pin 369c247" (left by #202), then boundary-check:FAIL.
          # Detach to the commit this tree names, the way verify-shared and the platform pin already do.
          qd="$lanes/quality-pin"
          qpin=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('eng/quality-pin.json','utf8')).commit)}catch(e){console.log('')}")
          if [ -n "$qpin" ] && [ -d "$qd/.git" ]; then
            if ! git -C "$qd" cat-file -e "$qpin^{commit}" 2>/dev/null; then
              if [ -n "${{ secrets.HARBORLINE_PINS_TOKEN }}" ]; then
                git -C "$qd" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' '${{ secrets.HARBORLINE_PINS_TOKEN }}' | base64 | tr -d '\n')" fetch -q origin 2>/dev/null || true
              else
                git -C "$qd" fetch -q origin 2>/dev/null || true
              fi
            fi
            git -C "$qd" checkout -q --detach "$qpin" 2>/dev/null || { echo "quality pin $qpin is not on this runner and cannot be fetched (private; no token)"; exit 6; }
            echo "quality-pin detached to $qpin"
          fi
          for r in control-gh:CONTROL quality-pin:QUALITY; do
            d="$lanes/${r%%:*}"
            if [ -d "$d/.git" ]; then
              echo "HARBORLINE_${r##*:}_REPO=$d" >> "$GITHUB_ENV"
              echo "${r%%:*} $(git -C "$d" rev-parse --short HEAD)"
            else
              echo "note: $d absent and no HARBORLINE_PINS_TOKEN; ${r%%:*} pin unavailable on this runner"
            fi
          done
          pin=$(node -e "console.log(JSON.parse(require('fs').readFileSync('eng/platform-pin.json','utf8')).commit)")
          # A clone left half-made by an interrupted run cannot read its trees: fetch, and re-clone on failure.
          if ! ( git -C "$plat" fetch -q origin && git -C "$plat" checkout -q --detach "$pin" ); then
            rm -rf "$plat"
            git clone -q https://github.com/Harborline-Software/harborline-platform.git "$plat"
            git -C "$plat" checkout -q --detach "$pin"
          fi
          git -C "$plat" clean -fdxq

      - name: Build the local platform feed
        run: node eng/build-local-feed.mjs

      - name: Host lane (exact-clone against this host's baseline)
        env:
          HARBORLINE_VERIFY_LANE: host
        run: bash eng/verify.sh

      # T-724 ruling 119e: same nightly-only, report-only drift check as verify-macos above.
      - name: Nightly known-tests drift report
        if: always() && github.event_name == 'schedule'
        run: node eng/known-tests-drift.mjs .claude/gate-evidence/known-tests-candidate.json

      - name: Publish main quality findings
        # Ticket 436: no gate step reads this any more -- the comparison is against the committed
        # eng/baselines/quality-baseline.json. It is kept because a re-pin needs a MEASURED finding
        # set from a gate host, and this is where a person gets one. It is evidence, not a gate input.
        if: always() && github.event_name == 'merge_group'
        uses: actions/upload-artifact@v7
        with:
          name: quality-findings-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/quality/findings.json

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-windows-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .git/harborline-api-verify-receipt.json
            .git/harborline-api-quality-decision.json
            .claude/gate-evidence/

  verify-windows-hosted:
    # Trial the full Windows host lane on a fresh VM. The required verify context still depends on
    # verify-windows (winbox); this job is advisory until its PR and merge-group receipts match.
    # Dependabot PRs have no access to the Actions secret needed for private pinned checkouts.
    if: >-
      vars.ACTIONS_ENABLED == 'true' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'merge_group' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false))
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      NUGET_PACKAGES: C:\nuget-runner
      HARBORLINE_VERIFY_LANE: host
      HARBORLINE_GATE_QUALITY: '1'
      HARBORLINE_GATE_COVERAGE: ${{ github.event_name == 'merge_group' && '1' || '' }}
    steps:
      - name: Git Bash on PATH
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'

      - name: Runner identity
        run: echo "Runner ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: ./.github/actions/platform-feed

      - name: Read the quality pin
        id: quality_pin
        run: echo "commit=$(node -p "require('./eng/quality-pin.json').commit")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: Harborline-Software/harborline-control
          ref: main
          path: .control
          token: ${{ secrets.HARBORLINE_PINS_TOKEN }}

      - uses: actions/checkout@v7
        with:
          repository: Harborline-Software/harborline-quality
          ref: ${{ steps.quality_pin.outputs.commit }}
          path: .quality
          token: ${{ secrets.HARBORLINE_PINS_TOKEN }}

      - name: Use pinned checkouts
        run: |
          printf '.control/\n.quality/\n.platform/\n' >> .git/info/exclude
          echo "HARBORLINE_CONTROL_REPO=$GITHUB_WORKSPACE/.control" >> "$GITHUB_ENV"
          echo "HARBORLINE_QUALITY_REPO=$GITHUB_WORKSPACE/.quality" >> "$GITHUB_ENV"
          echo "HARBORLINE_PLATFORM_REPO=$GITHUB_WORKSPACE/.platform" >> "$GITHUB_ENV"

      - name: Host lane (exact-clone against the Windows baseline)
        run: bash eng/verify.sh

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-windows-hosted-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .git/harborline-api-verify-receipt.json
            .git/harborline-api-quality-decision.json
            .claude/gate-evidence/

  stryker:
    # T-236 row 5: Stryker.NET, since origin/main, on each .NET test project whose mutated project has
    # changed .cs files (eng/mutation-report.mjs; projects with no change are skipped). Owner ruling
    # Q43 (option 2): surviving and uncovered mutants on changed lines are review feedback in the step
    # summary and the json artifact, never compared with the project floor (that is the nightly full
    # run's job, mutation.yml). It fails only when mutable code changed and no mutant was tested,
    # because Stryker exits 0 having mutated nothing (T-720). Advisory: not in `verify`'s needs.
    #
    # T-724 ruling 118 (Q50): moved off winbox onto a standard GitHub-hosted runner. Stryker.NET, the
    # pinned dotnet SDK and eng/mutation-report.mjs are all Linux-clean; the only things that were
    # winbox-specific were paths (C:\nuget-runner, $USERPROFILE) and a persistent local clone of
    # harborline-platform, which the platform-feed composite action (already used by the hosted jobs
    # in packages.yml) replaces with a per-run checkout at the recorded pin.
    # Pull requests only (a main or merge-group tree has nothing since origin/main). The fork and draft
    # guards are the other self-hosted lanes'.
    needs: [verify-windows]
    if: >-
      vars.ACTIONS_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      VSTEST_CONNECTION_TIMEOUT: '300'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: ./.github/actions/platform-feed

      - name: Mutation (since origin/main)
        run: |
          dotnet tool restore
          node eng/mutation-report.mjs

      - name: Mutation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: .stryker/*/reports/mutation-report.json
