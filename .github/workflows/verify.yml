# verify: required mini portable proof; native Windows/macOS are manual during development.
# Fork and draft guards still protect the self-hosted lanes; the required aggregator remains unconditional.
name: verify

on:
  # T-577: no push-to-main run. The merge group already proved the exact commit that lands, so a
  # push run would be the third full measurement of one tree. Required contexts still run on
  # pull_request because the queue admits a PR only after its required checks pass on the PR itself.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: '17 6 * * *'   # nightly hosted portable datapoint; native Windows/macOS are temporarily manual-only
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

jobs:
  verify-route:
    # Admission is decided before either Linux lane executes. Unsupported known
    # shapes retain hosted Linux; inconsistent/unavailable metadata fails red.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      route: ${{ steps.select.outputs.route }}
      decision-digest: ${{ steps.select.outputs.decision-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # BEGIN immutable mini selector
          python3 -I - <<'PY'
          import hashlib, pathlib, subprocess, sys, tempfile
          approved = {
              'required-route.py': '2a364a69bbe0a455d8262bc0c3b89dd12adedd560c6618e0eb87ca665f33cd4d',
              'controller.py': 'e6468b9f7082c4774d1c6c7c5d4c37ea5646c713caaa9bdb8fd62a5f7b47b33d',
              'admission.py': '1b492a8d46423ef71dfe292cbf2d3d22953a5bf0e62b8c63293e614c01b4d551',
          }
          with tempfile.TemporaryDirectory(prefix='mini-selector-') as temporary:
              target = pathlib.Path(temporary)
              for name, expected in approved.items():
                  data = (pathlib.Path('eng/mini-runner') / name).read_bytes()
                  if hashlib.sha256(data).hexdigest() != expected:
                      raise SystemExit('Unreviewed selector module: ' + name)
                  (target / name).write_bytes(data)
              subprocess.run([sys.executable, '-I', str(target / 'required-route.py')], check=True)
          PY
          # END immutable mini selector

  verify-mini:
    needs: [verify-route]
    if: vars.ACTIONS_ENABLED == 'true' && needs.verify-route.outputs.route == 'mini'
    permissions: {}
    runs-on: [self-hosted, harborline-api-mini-required-v3-run-bound, linux-arm64-orbstack, lane-a, 'harborline-run-${{ github.run_id }}']
    timeout-minutes: 50
    env:
      HARBORLINE_GATE_COVERAGE: ${{ github.event_name == 'merge_group' && '1' || '0' }}
    steps:
      # No actions, secrets, checkout or preparation before the immutable hook.
      # The immutable wrapper validates evidence before this job can succeed.
      - name: Required portable gate at admitted candidate
        shell: bash
        run: /opt/mini/portable-gate.sh

  verify-shared:
    needs: [verify-route]
    if: >-
      needs.verify-route.outputs.route == 'hosted' &&
      vars.ACTIONS_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'merge_group' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.labels.*.name, 'stacked')))
    # Hosted fallback only: the mini all-17 gate already includes every shared step.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      # Quality reads exact-clone SARIF and remains with the selected portable/Linux
      # lane. The immutable mini runs all 17 steps; hosted Linux explicitly enables quality.
      # 2026-09-29 (owner): the shared lane also skips the package lanes (contracts TypeScript / C# /
      # Rust, operator-cli-headless, packages). packages.yml's required protocol-lane-conformance,
      # operator-cli-headless and pack-consume jobs run the same commands and own that proof, so this
      # lane compiles no Rust and needs no toolchain for it.
      HARBORLINE_VERIFY_LANE: shared
    steps:
      - name: Runner identity
        shell: bash
        run: echo "Runner ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Read the quality pin
        id: quality_pin
        run: echo "commit=$(jq -r '.commit' eng/quality-pin.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: Harborline-Software/harborline-control
          ref: main
          path: .control
          token: ${{ secrets.HARBORLINE_PINS_TOKEN }}

      - uses: actions/checkout@v7
        with:
          repository: Harborline-Software/harborline-quality
          ref: ${{ steps.quality_pin.outputs.commit }}
          path: .quality
          token: ${{ secrets.HARBORLINE_PINS_TOKEN }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: ./.github/actions/platform-feed

      - name: Use pinned checkouts
        run: |
          mv .platform "$RUNNER_TEMP/harborline-platform"
          ln -s "$RUNNER_TEMP/harborline-platform" .platform
          printf '.control/\n.quality/\n.platform\n' >> .git/info/exclude
          echo "HARBORLINE_CONTROL_REPO=$GITHUB_WORKSPACE/.control" >> "$GITHUB_ENV"
          echo "HARBORLINE_QUALITY_REPO=$GITHUB_WORKSPACE/.quality" >> "$GITHUB_ENV"
          echo "HARBORLINE_PLATFORM_REPO=$GITHUB_WORKSPACE/.platform" >> "$GITHUB_ENV"

      - name: eng/verify.sh
        run: bash eng/verify.sh

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .git/harborline-api-verify-receipt.json
            .git/harborline-api-quality-decision.json
            .claude/gate-evidence/
            .claude/gate-evidence/*.trx
            artifacts/quality/

  verify:
    # Required context stays unconditional and fail-closed for the selected Linux
    # route and hosted perf. Shared proof comes from mini all-17 or hosted shared.
    # Development policy requires native jobs skipped on automatic events;
    # workflow_dispatch requires full hosted Windows and macOS success. Restore
    # automatic native validation before release; see eng/mini-runner/README.md.
    needs: [verify-route, verify-mini, verify-shared, verify-macos, verify-linux, verify-windows, verify-windows-hosted, verify-perf-hosted]
    if: always() && !contains(github.event.pull_request.labels.*.name, 'stacked')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every selected lane this context stands for ran and passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          LINUX_ROUTE: ${{ needs.verify-route.outputs.route }}
          DRAFT: ${{ github.event.pull_request.draft }}
          NATIVE_POLICY: ${{ github.event_name == 'workflow_dispatch' && 'required' || 'development-suspended' }}
        run: |
          # BEGIN required mini aggregate
          if [ "$DRAFT" = "true" ]; then
            echo "::error::draft PR cannot satisfy required verification"
            exit 1
          fi
          jq -e --arg route "$LINUX_ROUTE" --arg native "$NATIVE_POLICY" '
            ($route == "mini" or $route == "hosted")
            and ([."verify-route", ."verify-perf-hosted"] | all(.result == "success"))
            and (if $route == "mini" then
                   ."verify-mini".result == "success" and ."verify-linux".result == "skipped"
                   and ."verify-shared".result == "skipped"
                 else
                   ."verify-linux".result == "success" and ."verify-mini".result == "skipped"
                   and ."verify-shared".result == "success"
                 end)
            and ."verify-windows".result == "skipped"
            and (if $native == "development-suspended" then
                   ."verify-windows-hosted".result == "skipped" and ."verify-macos".result == "skipped"
                 elif $native == "required" then
                   ."verify-windows-hosted".result == "success" and ."verify-macos".result == "success"
                 else false end)
          ' <<< "$NEEDS" >/dev/null || { echo "::error::a selected required lane did not succeed"; exit 1; }
          if [ "$NATIVE_POLICY" = "development-suspended" ]; then
            echo "Native Windows/macOS validation suspended for development; restore and pass both before release." >> "$GITHUB_STEP_SUMMARY"
          fi
          # END required mini aggregate

  verify-perf:
    # Advisory comparison with the hosted perf gate during mac16's retirement window. The
    # LayoutTimingParity collection runs alone on mac16; the host lanes exclude Lane=perf.
    #
    # PERF_HOST_OFFLINE_SINCE skips this comparison if mac16 is offline. It no longer affects
    # the required verify context.
    #
    # T-662: the fork guard, character for character the one the other lanes carry.
    if: >-
      vars.ACTIONS_ENABLED == 'true' &&
      vars.PERF_HOST_OFFLINE_SINCE == '' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'merge_group' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.labels.*.name, 'stacked')))
    runs-on: [self-hosted, macOS, X64, mac16, perf-quiet]
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - name: Runner identity
        shell: bash
        run: |
          echo "Runner ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - name: Resolve the host pin directories
        run: |
          lanes="$HOME/Projects/Harborline/lanes"
          echo "HARBORLINE_PLATFORM_REPO=$lanes/platform-pin" >> "$GITHUB_ENV"

      - name: Refresh the platform pin
        run: |
          pin=$(node -e "console.log(JSON.parse(require('fs').readFileSync('eng/platform-pin.json','utf8')).commit)")
          if [ ! -d "$HARBORLINE_PLATFORM_REPO/.git" ]; then git clone -q https://github.com/Harborline-Software/harborline-platform.git "$HARBORLINE_PLATFORM_REPO"; fi
          git -C "$HARBORLINE_PLATFORM_REPO" cat-file -e "$pin^{commit}" 2>/dev/null || git -C "$HARBORLINE_PLATFORM_REPO" fetch -q origin
          git -C "$HARBORLINE_PLATFORM_REPO" checkout -q --detach "$pin" && git -C "$HARBORLINE_PLATFORM_REPO" clean -fdxq
          echo "platform $pin"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Quiet perf and feed under the machine reservation
        env:
          HARBORLINE_PERF_QUIET: '1'
        run: python .github/workloads/host-workload-lock.py -- bash .github/workloads/perf.sh

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-perf-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .claude/gate-evidence/

  verify-perf-hosted:
    # Required timing-parity gate on a fresh Linux VM; mac16 runs the same tests as an
    # advisory comparison during its retirement window.
    if: >-
      vars.ACTIONS_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'merge_group' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.labels.*.name, 'stacked')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Runner identity
        run: echo "Runner ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: ./.github/actions/platform-feed

      - name: Perf lane (Lane=perf)
        # T-680: a fresh VM running only this lane, so the timing gate applies its quiet bounds.
        env:
          HARBORLINE_PERF_QUIET: '1'
        run: |
          set -o pipefail
          mkdir -p .claude/gate-evidence
          dotnet test apps/local-node-host/tests/tests.csproj -c Release --nologo -nodeReuse:false \
            --filter "Lane=perf" \
            --logger "trx;LogFileName=perf-tests.trx" --results-directory .claude/gate-evidence \
            --logger "console;verbosity=detailed" \
            -- RunConfiguration.TreatNoTestsAsError=true | tee .claude/gate-evidence/perf-tests.log

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-perf-hosted-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true  # the path is a dot-folder, which upload-artifact skips by default
          path: .claude/gate-evidence/

  # The two host lanes. Each runs exact-clone against its own baseline, in parallel with the shared
  # lane, and since T-578 each is on the landing's critical path through the `verify` aggregator.
  verify-macos:
    # Owner-authorized development suspension. Restore automatic native checks
    # before release; full macOS remains available on manual workflow_dispatch.
    if: vars.ACTIONS_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
      HARBORLINE_VERIFY_LANE: host
    steps:
      - name: Runner identity
        shell: bash
        run: echo "Runner ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: ./.github/actions/platform-feed

      - name: Use pinned platform
        run: |
          echo '.platform/' >> .git/info/exclude
          echo "HARBORLINE_PLATFORM_REPO=$GITHUB_WORKSPACE/.platform" >> "$GITHUB_ENV"

      - name: Host lane (exact-clone against this host's baseline)
        run: bash eng/verify.sh

      # T-724 ruling 119e: report-only, nightly only -- never runs against a pull request, so it can
      # never block one, and it never writes anything (the fix is a reviewed --write-known-tests
      # commit, not a workflow auto-commit). A red step here means a merged PR added or removed a
      # host or capability test without a knownTests refresh in the same PR.
      - name: Nightly known-tests drift report
        if: always() && github.event_name == 'schedule'
        run: node eng/known-tests-drift.mjs .claude/gate-evidence/known-tests-candidate.json

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-macos-evidence-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .git/harborline-api-verify-receipt.json
            .claude/gate-evidence/

  verify-linux:
    # The Ubuntu half of the host lane (2026-09-29, owner: Ubuntu is a supported host). Moved from
    # packages.yml's build-and-test, which ran the same exact-clone against the same baseline but only
    # on merge groups and outside any required context. The guards are verify-macos's, character for
    # character. eng/verify.sh selects host-test-baseline.ubuntu.json from uname -s.
    needs: [verify-route]
    if: >-
      needs.verify-route.outputs.route == 'hosted' &&
      vars.ACTIONS_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'merge_group' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.labels.*.name, 'stacked')))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      HARBORLINE_VERIFY_LANE: host
      HARBORLINE_GATE_QUALITY: '1'
      HARBORLINE_GATE_COVERAGE: ${{ github.event_name == 'merge_group' && '1' || '' }}
    steps:
      - name: Runner identity
        shell: bash
        run: echo "Runner ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          # MinVer derives the version from git history, and repo-wide TreatWarningsAsErrors
          # would turn its shallow-clone warning into a build failure.
          fetch-depth: 0
          clean: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: ./.github/actions/platform-feed

      - name: Read the quality pin
        id: quality_pin
        run: echo "commit=$(jq -r '.commit' eng/quality-pin.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: Harborline-Software/harborline-control
          ref: main
          path: .control
          token: ${{ secrets.HARBORLINE_PINS_TOKEN }}

      - uses: actions/checkout@v7
        with:
          repository: Harborline-Software/harborline-quality
          ref: ${{ steps.quality_pin.outputs.commit }}
          path: .quality
          token: ${{ secrets.HARBORLINE_PINS_TOKEN }}

      - name: Use pinned checkouts
        run: |
          printf '.control/\n.quality/\n.platform/\n' >> .git/info/exclude
          echo "HARBORLINE_CONTROL_REPO=$GITHUB_WORKSPACE/.control" >> "$GITHUB_ENV"
          echo "HARBORLINE_QUALITY_REPO=$GITHUB_WORKSPACE/.quality" >> "$GITHUB_ENV"
          echo "HARBORLINE_PLATFORM_REPO=$GITHUB_WORKSPACE/.platform" >> "$GITHUB_ENV"

      - name: Host lane (exact-clone against the Ubuntu baseline)
        run: bash eng/verify.sh

      - name: Publish main quality findings
        if: always() && github.event_name == 'merge_group'
        uses: actions/upload-artifact@v7
        with:
          name: quality-findings-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/quality/findings.json

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-linux-evidence-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .git/harborline-api-verify-receipt.json
            .git/harborline-api-quality-decision.json
            .claude/gate-evidence/
            artifacts/quality/

  verify-windows:
    # Temporary development suspension: no automatic Windows execution.
    # Full hosted Windows remains available through workflow_dispatch.
    if: ${{ false }}
    runs-on: [self-hosted, Windows, winbox]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      NUGET_PACKAGES: C:\nuget-runner
      # 339 s4 / 2026-09-10: without this the roslyn SARIF is never produced and the quality step
      # compares an empty set. Coverage stays with the merge-queue run only (2026-09-08 ruling).
      # Ticket 421: exactly ONE host sets this, so the quality comparison happens once per event
      # however many hosts run the suite. verify-macos deliberately does not.
      HARBORLINE_GATE_QUALITY: '1'
      HARBORLINE_GATE_COVERAGE: ${{ github.event_name == 'merge_group' && '1' || '' }}
    steps:
      - name: Git Bash on PATH for the service account
        # Only C:\Program Files\Git\cmd is on the machine PATH; bash.exe lives in ...\Git\bin.
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'

      - name: Runner identity
        # After the PATH step: bash is not on the service account's PATH until it runs.
        shell: bash
        run: echo "Runner ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - name: pnpm for the runner account, once
        # The capability suite inside the clone gate runs under vitest. Nothing here builds Rust.
        run: |
          command -v pnpm >/dev/null 2>&1 || npm install -g pnpm@10
          echo "$APPDATA\npm" >> "$GITHUB_PATH"

      - name: Host pins (fresh clones under the runner account; public over HTTPS)
        run: |
          lanes="$USERPROFILE/Projects/Harborline/lanes"; mkdir -p "$lanes"
          [ -d "$lanes/platform-pin/.git" ] || git clone -q https://github.com/Harborline-Software/harborline-platform.git "$lanes/platform-pin"
          plat="$lanes/platform-pin"; echo "HARBORLINE_PLATFORM_REPO=$plat" >> "$GITHUB_ENV"
          # control and quality are private: with HARBORLINE_PINS_TOKEN they are cloned and refreshed here.
          # Dependabot pull requests never see repo secrets, so without the token the runner account's
          # already-seeded clones stand in -- identity-r3 is not skippable and needs a control checkout.
          if [ -n "${{ secrets.HARBORLINE_PINS_TOKEN }}" ]; then
            for r in control-gh:harborline-control quality-pin:harborline-quality; do
              d="$lanes/${r%%:*}"; [ -d "$d/.git" ] || git clone -q "https://x-access-token:${{ secrets.HARBORLINE_PINS_TOKEN }}@github.com/Harborline-Software/${r##*:}.git" "$d"
              git -C "$d" fetch -q origin
            done
          fi
          # This job never detached the quality clone, so it read whatever commit the directory was
          # left at. verify-shared used to be unlabelled and land on this host too, detaching this
          # same directory ($HOME and $USERPROFILE are one path here) to ITS tree's pin -- so the pin
          # from whichever run went last leaked into the next one's boundary check. Measured: PR #203
          # pins ced797c2 and logged "quality-pin 369c247" (left by #202), then boundary-check:FAIL.
          # Detach to the commit this tree names, the way verify-shared and the platform pin already do.
          qd="$lanes/quality-pin"
          qpin=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('eng/quality-pin.json','utf8')).commit)}catch(e){console.log('')}")
          if [ -n "$qpin" ] && [ -d "$qd/.git" ]; then
            if ! git -C "$qd" cat-file -e "$qpin^{commit}" 2>/dev/null; then
              if [ -n "${{ secrets.HARBORLINE_PINS_TOKEN }}" ]; then
                git -C "$qd" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' '${{ secrets.HARBORLINE_PINS_TOKEN }}' | base64 | tr -d '\n')" fetch -q origin 2>/dev/null || true
              else
                git -C "$qd" fetch -q origin 2>/dev/null || true
              fi
            fi
            git -C "$qd" checkout -q --detach "$qpin" 2>/dev/null || { echo "quality pin $qpin is not on this runner and cannot be fetched (private; no token)"; exit 6; }
            echo "quality-pin detached to $qpin"
          fi
          for r in control-gh:CONTROL quality-pin:QUALITY; do
            d="$lanes/${r%%:*}"
            if [ -d "$d/.git" ]; then
              echo "HARBORLINE_${r##*:}_REPO=$d" >> "$GITHUB_ENV"
              echo "${r%%:*} $(git -C "$d" rev-parse --short HEAD)"
            else
              echo "note: $d absent and no HARBORLINE_PINS_TOKEN; ${r%%:*} pin unavailable on this runner"
            fi
          done
          pin=$(node -e "console.log(JSON.parse(require('fs').readFileSync('eng/platform-pin.json','utf8')).commit)")
          # A clone left half-made by an interrupted run cannot read its trees: fetch, and re-clone on failure.
          if ! ( git -C "$plat" fetch -q origin && git -C "$plat" checkout -q --detach "$pin" ); then
            rm -rf "$plat"
            git clone -q https://github.com/Harborline-Software/harborline-platform.git "$plat"
            git -C "$plat" checkout -q --detach "$pin"
          fi
          git -C "$plat" clean -fdxq

      - name: Build the local platform feed
        run: node eng/build-local-feed.mjs

      - name: Host lane (exact-clone against this host's baseline)
        env:
          HARBORLINE_VERIFY_LANE: host
        run: bash eng/verify.sh

      # T-724 ruling 119e: same nightly-only, report-only drift check as verify-macos above.
      - name: Nightly known-tests drift report
        if: always() && github.event_name == 'schedule'
        run: node eng/known-tests-drift.mjs .claude/gate-evidence/known-tests-candidate.json

      - name: Publish main quality findings
        # Ticket 436: no gate step reads this any more -- the comparison is against the committed
        # eng/baselines/quality-baseline.json. It is kept because a re-pin needs a MEASURED finding
        # set from a gate host, and this is where a person gets one. It is evidence, not a gate input.
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: quality-findings-winbox-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/quality/findings.json

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-windows-evidence-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .git/harborline-api-verify-receipt.json
            .git/harborline-api-quality-decision.json
            .claude/gate-evidence/

  verify-windows-hosted:
    # Temporary development suspension: no automatic Windows execution.
    # Full hosted Windows remains available through workflow_dispatch.
    if: vars.ACTIONS_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      NUGET_PACKAGES: C:\nuget-runner
      HARBORLINE_VERIFY_LANE: host
      HARBORLINE_GATE_QUALITY: '1'
      HARBORLINE_GATE_COVERAGE: ${{ github.event_name == 'merge_group' && '1' || '' }}
    steps:
      - name: Runner identity
        run: echo "Runner ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - name: Check pnpm entry point before the host build
        run: node --input-type=module -e "import {resolveCommand} from './eng/lib/resolve-command.mjs'; console.log(resolveCommand('pnpm', ['--version']).args[0])"

      - uses: ./.github/actions/platform-feed

      - name: Read the quality pin
        id: quality_pin
        run: echo "commit=$(node -p "require('./eng/quality-pin.json').commit")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: Harborline-Software/harborline-control
          ref: main
          path: .control
          token: ${{ secrets.HARBORLINE_PINS_TOKEN }}

      - uses: actions/checkout@v7
        with:
          repository: Harborline-Software/harborline-quality
          ref: ${{ steps.quality_pin.outputs.commit }}
          path: .quality
          token: ${{ secrets.HARBORLINE_PINS_TOKEN }}

      - name: Use pinned checkouts
        run: |
          printf '.control/\n.quality/\n.platform/\n' >> .git/info/exclude
          echo "HARBORLINE_CONTROL_REPO=$GITHUB_WORKSPACE/.control" >> "$GITHUB_ENV"
          echo "HARBORLINE_QUALITY_REPO=$GITHUB_WORKSPACE/.quality" >> "$GITHUB_ENV"
          echo "HARBORLINE_PLATFORM_REPO=$GITHUB_WORKSPACE/.platform" >> "$GITHUB_ENV"

      - name: Host lane (exact-clone against the Windows baseline)
        run: bash eng/verify.sh

      - name: Publish main quality findings
        # Moved from verify-windows (winbox) with the required lane: a re-pin needs a measured finding
        # set from a gate host (ticket 436). Evidence, not a gate input.
        if: always() && github.event_name == 'merge_group'
        uses: actions/upload-artifact@v7
        with:
          name: quality-findings-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/quality/findings.json

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-windows-hosted-evidence-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .git/harborline-api-verify-receipt.json
            .git/harborline-api-quality-decision.json
            .claude/gate-evidence/

  stryker:
    # T-236 row 5: Stryker.NET, since origin/main, on each .NET test project whose mutated project has
    # changed .cs files (eng/mutation-report.mjs; projects with no change are skipped). Owner ruling
    # Q43 (option 2): surviving and uncovered mutants on changed lines are review feedback in the step
    # summary and the json artifact, never compared with the project floor (that is the nightly full
    # run's job, mutation.yml). It fails only when mutable code changed and no mutant was tested,
    # because Stryker exits 0 having mutated nothing (T-720). Advisory: not in `verify`'s needs.
    #
    # T-724 ruling 118 (Q50): moved off winbox onto a standard GitHub-hosted runner. Stryker.NET, the
    # pinned dotnet SDK and eng/mutation-report.mjs are all Linux-clean; the only things that were
    # winbox-specific were paths (C:\nuget-runner, $USERPROFILE) and a persistent local clone of
    # harborline-platform, which the platform-feed composite action (already used by the hosted jobs
    # in packages.yml) replaces with a per-run checkout at the recorded pin.
    # Pull requests only (a main or merge-group tree has nothing since origin/main). The fork and draft
    # guards are the other self-hosted lanes'.
    # Follow the required portable verdict while Windows is suspended, so skipped
    # Windows work cannot silently disable this existing advisory mutation job.
    needs: [verify]
    if: >-
      vars.ACTIONS_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'stacked')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      VSTEST_CONNECTION_TIMEOUT: '300'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: ./.github/actions/platform-feed

      - name: Mutation (since origin/main)
        run: |
          dotnet tool restore
          node eng/mutation-report.mjs

      - name: Mutation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true  # the path is a dot-folder, which upload-artifact skips by default
          path: .stryker/*/reports/mutation-report.json
