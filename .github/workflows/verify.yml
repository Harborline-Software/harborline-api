# verify: eng/verify.sh on a self-hosted macOS runner, as a pull-request check and as the merge-queue
# check. This is the same gate the Mac slice-gate wrapper ran by ssh; the runner replaces the wrapper,
# the merge queue replaces the receipt-by-tree landing (control: docs/velocity/landing.md).
#
# Fork safety: harborline-api is public and this job runs on our own machines. It runs only for
# pull requests whose head lives in this repository, and for merge-queue groups (which are built from
# already-reviewed heads). A fork PR gets the hosted checks only.
name: verify

on:
  pull_request:
  merge_group:
  schedule:
    - cron: '17 6 * * *'   # nightly Windows datapoint against main (verify-windows below)
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    if: >-
      vars.ACTIONS_ENABLED == 'true' &&
      (github.event_name == 'merge_group' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
      # 339 s4 / 2026-09-10: without this the roslyn SARIF is never produced and the quality step
      # compares an empty set. Coverage stays with the merge-queue run only (2026-09-08 ruling).
      HARBORLINE_GATE_QUALITY: '1'
      HARBORLINE_GATE_COVERAGE: ${{ github.event_name == 'merge_group' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: true

      - name: Resolve the host pin directories
        run: |
          lanes="$HOME/Projects/Harborline/lanes"
          test -d "$lanes/control-gh/.git" || { echo "control-gh clone missing under $lanes"; exit 6; }
          echo "HARBORLINE_CONTROL_REPO=$lanes/control-gh" >> "$GITHUB_ENV"
          echo "HARBORLINE_PLATFORM_REPO=$lanes/platform-pin" >> "$GITHUB_ENV"
          echo "HARBORLINE_QUALITY_REPO=$lanes/quality-pin" >> "$GITHUB_ENV"

      - name: Refresh the control, quality and platform pins (the wrapper's lines, under the runner account)
        # The runner account holds no credentials. The public pin (platform) fetches over HTTPS; the
        # private ones (control, quality) fetch only once a read-only token exists on the runner, and
        # until then stay at the snapshot the account was seeded with. The log says which.
        run: |
          for l in control-gh:harborline-control quality-pin:harborline-quality platform-pin:harborline-platform platform-gh:harborline-platform; do
            d="$HOME/Projects/Harborline/lanes/${l%%:*}"; r="${l##*:}"
            [ -d "$d/.git" ] && git -C "$d" remote set-url origin "https://github.com/Harborline-Software/$r.git"
          done
          git -C "$HARBORLINE_CONTROL_REPO" pull -q --ff-only origin main 2>/dev/null || echo "note: control-gh not refreshed (private; no token on the runner account); seeded snapshot $(git -C "$HARBORLINE_CONTROL_REPO" rev-parse --short HEAD)"
          qpin=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('eng/quality-pin.json','utf8')).commit)}catch(e){console.log('')}")
          if [ -n "$qpin" ] && [ -d "$HARBORLINE_QUALITY_REPO/.git" ]; then
            git -C "$HARBORLINE_QUALITY_REPO" cat-file -e "$qpin^{commit}" 2>/dev/null || git -C "$HARBORLINE_QUALITY_REPO" fetch -q origin 2>/dev/null || true
            git -C "$HARBORLINE_QUALITY_REPO" checkout -q --detach "$qpin" 2>/dev/null || { echo "quality pin $qpin is not on this runner and cannot be fetched (private; no token)"; exit 6; }
          fi
          pin=$(node -e "console.log(JSON.parse(require('fs').readFileSync('eng/platform-pin.json','utf8')).commit)")
          if [ ! -d "$HARBORLINE_PLATFORM_REPO/.git" ]; then git clone -q https://github.com/Harborline-Software/harborline-platform.git "$HARBORLINE_PLATFORM_REPO"; fi
          git -C "$HARBORLINE_PLATFORM_REPO" cat-file -e "$pin^{commit}" 2>/dev/null || git -C "$HARBORLINE_PLATFORM_REPO" fetch -q origin
          git -C "$HARBORLINE_PLATFORM_REPO" checkout -q --detach "$pin" && git -C "$HARBORLINE_PLATFORM_REPO" clean -fdxq
          echo "control $(git -C "$HARBORLINE_CONTROL_REPO" rev-parse --short HEAD)  quality $qpin  platform $pin"

      - name: Rust toolchain for the runner account
        # rustup's default toolchain is per user (~/.rustup); the runner account starts with none, and
        # verify.sh's contracts-rust step needs one. Set once, kept in the account's own home.
        run: |
          rustup show active-toolchain >/dev/null 2>&1 || rustup default stable
          rustup show active-toolchain
          cargo --version

      - name: Build the local platform feed
        run: node eng/build-local-feed.mjs

      - name: eng/verify.sh
        run: bash eng/verify.sh

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: verify-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .git/harborline-api-verify-receipt.json
            .git/harborline-api-quality-decision.json
            .claude/land-evidence/
            artifacts/quality/

  # Windows datapoint: verify.sh has no Windows-only steps, only a Windows-specific host baseline, and
  # the Windows-only defect class (File.Move semantics, path separators) has shown up the other way
  # round. So this is a nightly, non-required run against main, never a PR or merge-queue check.
  verify-windows:
    if: vars.ACTIONS_ENABLED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Windows]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      HARBORLINE_GATE_QUALITY: '1'
      NUGET_PACKAGES: C:\nuget-runner
    steps:
      - name: Git Bash on PATH for the service account
        # Only C:\Program Files\Git\cmd is on the machine PATH; bash.exe lives in ...\Git\bin.
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: true

      - name: Per-user toolchain for the runner account (pnpm, rustup), once
        run: |
          command -v pnpm >/dev/null 2>&1 || npm install -g pnpm@10
          if ! command -v cargo >/dev/null 2>&1; then
            curl -fsSLo "$RUNNER_TEMP/rustup-init.exe" https://win.rustup.rs/x86_64
            "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal --default-toolchain stable
          fi
          echo "$USERPROFILE\.cargo\bin" >> "$GITHUB_PATH"
          echo "$APPDATA\npm" >> "$GITHUB_PATH"

      - name: Host pins (fresh clones under the runner account; public over HTTPS)
        run: |
          lanes="$USERPROFILE/Projects/Harborline/lanes"; mkdir -p "$lanes"
          [ -d "$lanes/platform-pin/.git" ] || git clone -q https://github.com/Harborline-Software/harborline-platform.git "$lanes/platform-pin"
          plat="$lanes/platform-pin"; echo "HARBORLINE_PLATFORM_REPO=$plat" >> "$GITHUB_ENV"
          # control and quality are private: they need HARBORLINE_PINS_TOKEN; without it the steps that read them are skipped by verify.sh's own refusal and this job reports it.
          if [ -n "${{ secrets.HARBORLINE_PINS_TOKEN }}" ]; then
            for r in control-gh:harborline-control quality-pin:harborline-quality; do
              d="$lanes/${r%%:*}"; [ -d "$d/.git" ] || git clone -q "https://x-access-token:${{ secrets.HARBORLINE_PINS_TOKEN }}@github.com/Harborline-Software/${r##*:}.git" "$d"
              git -C "$d" fetch -q origin
            done
            echo "HARBORLINE_CONTROL_REPO=$lanes/control-gh" >> "$GITHUB_ENV"
            echo "HARBORLINE_QUALITY_REPO=$lanes/quality-pin" >> "$GITHUB_ENV"
          else
            echo "note: HARBORLINE_PINS_TOKEN not set; control and quality pins unavailable on this runner"
          fi
          pin=$(node -e "console.log(JSON.parse(require('fs').readFileSync('eng/platform-pin.json','utf8')).commit)")
          # A clone left half-made by an interrupted run cannot read its trees: fetch, and re-clone on failure.
          if ! ( git -C "$plat" fetch -q origin && git -C "$plat" checkout -q --detach "$pin" ); then
            rm -rf "$plat"
            git clone -q https://github.com/Harborline-Software/harborline-platform.git "$plat"
            git -C "$plat" checkout -q --detach "$pin"
          fi
          git -C "$plat" clean -fdxq

      - name: Build the local platform feed
        run: node eng/build-local-feed.mjs

      - name: eng/verify.sh
        run: bash eng/verify.sh

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: verify-windows-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .git/harborline-api-verify-receipt.json
            .git/harborline-api-quality-decision.json
            .claude/land-evidence/
