# review-gate-test: runs .github/tests/review-gate.test.sh when review-gate's script, lists or test change. A plain
# pull_request run with a read-only token: it runs the PR's own copy of the script against a stand-in gh, needs no
# secrets and sets no status the gate reads.
name: review-gate-test

on:
  pull_request:
    paths:
      - .github/review-gate.sh
      - .github/review-*-paths
      - .github/tests/review-gate.test.sh
      - .github/workflows/review-gate-test.yml

permissions:
  contents: read

jobs:
  test:
    if: vars.ACTIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false
      - run: bash .github/tests/review-gate.test.sh
