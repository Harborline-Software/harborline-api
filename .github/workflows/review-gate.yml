# review-gate: sets one commit status, `review-gate`, on each ready PR's head, saying whether the PR has the
# review PROC-0001 asks for ("Review policy, 2026-11-01"): one clean pass from any of the Claude review, Codex
# or CodeRabbit, and no blocker from any reviewer that ran. A change under .github/, or one the Claude review
# escalates, also needs a clean Codex security review on its head; comment "@codex security review" to ask
# for one after a push, because Codex reviews on its own only when a PR opens or is marked ready.
# A PR that touches only paths on .github/review-exempt-paths, or a Dependabot patch or minor update that only
# Dependabot wrote, needs no review if it touches nothing risky, unless a reviewer that ran left a blocker. A risky
# change, every GitHub Actions bump included, always needs a review and the Codex security review.
#
# The logic is .github/review-gate.sh. Every trigger checks out that script and its risky list from the default
# branch and runs only that code, never anything from the PR's base or head, so a PR cannot change its own pass
# rule. The PR's files and text are only data the script reads through the API:
# - pull_request_target: a new head starts out pending, and a new base drops passes given before it.
# - issue_comment: Codex and CodeRabbit update their summary comments when a review finishes.
# - pull_request_review: a submitted, edited or dismissed review (CodeRabbit's verdict lives there). GitHub runs
#   this event with the PR's copy of this file, so that run only dispatches a check of the PR from the default
#   branch; it evaluates nothing itself.
# - schedule: catches what sends no event this workflow can use, like a resolved thread or a CodeRabbit review.
#   It covers fork PRs too: the script only reads the PR and sets one status on its head. The sweep evaluates
#   nothing itself; it dispatches one run per PR, so every evaluation of a PR shares that PR's group and an
#   older snapshot can never land after a newer one.
# - workflow_dispatch: the review workflow calls it after the Claude review sets claude-review, and anyone can
#   re-check one PR by number.
#
# - merge_group: the queue's commit gets review-gate too, carried over from the result the PR earned on its own head
#   (review-gate-queue.sh), so the context can become required without stalling the queue.
#
# It sets a commit status rather than relying on its own check, because GitHub records pull_request_target
# checks against the base branch, not the PR head. Shadow mode: nothing requires `review-gate` until the owner
# adds it to the ruleset.
#
# Auto-merge (review-gate-arm.sh): once the gate passes a PR and finds nothing risky, the auto-merge job decides
# whether it may merge on its own. Watch-only until the owner sets the repository variable AUTO_MERGE to `arm`: it
# only reports "would arm". In arm mode it turns on auto-merge for that exact head with a token from the merge app
# (variable MERGE_APP_CLIENT_ID, secret MERGE_APP_KEY), because the workflow token can't add a PR to a merge queue.
# Setting AUTO_MERGE back to anything else stops all arming; PRs already armed keep their auto-merge until it is
# turned off on each.
name: review-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  schedule:
    - cron: '*/20 * * * *'
  merge_group:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to check
        required: true
        type: number

concurrency:
  # An event the gate ignores gets a group of its own, so its skipped run can't cancel or replace a real one.
  # A merge group keys on its own ref, which is unique per queue entry, so it never cancels or replaces another run.
  group: >-
    ${{ github.event_name == 'merge_group' && format('review-gate-queue-{0}', github.event.merge_group.head_ref) ||
        github.event_name == 'schedule' && 'review-gate-sweep' ||
        github.event_name == 'pull_request_review' && format('review-gate-relay-{0}', github.run_id) ||
        ((github.event_name == 'issue_comment' && !(github.event.issue.pull_request &&
          contains(fromJSON('["chatgpt-codex-connector[bot]","coderabbitai[bot]"]'), github.event.comment.user.login))) ||
         (github.event.action == 'edited' && github.event_name == 'pull_request_target' && !github.event.changes.base)) &&
          format('review-gate-skip-{0}', github.run_id) ||
        format('review-gate-{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'merge_group' }}

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    if: >-
      vars.ACTIONS_ENABLED == 'true' && github.event_name != 'schedule' && github.event_name != 'pull_request_review' &&
      github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request_target' || github.event.action != 'edited' || github.event.changes.base) &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request &&
        contains(fromJSON('["chatgpt-codex-connector[bot]","coderabbitai[bot]"]'), github.event.comment.user.login)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Written by review-gate.sh only once its status stands on the head; the auto-merge job reads them.
    outputs:
      state: ${{ steps.gate.outputs.state }}
      risky: ${{ steps.gate.outputs.risky }}
      head: ${{ steps.gate.outputs.head }}
    steps:
      # Only main's code runs here, for every event: the script and its fallback list come from the default branch,
      # never from the PR's base or head. The script may read a protected base branch's list as data; see the script.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/review-gate.sh
            .github/review-risky-paths
            .github/review-exempt-paths
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set review-gate on the PR head
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          # Lets the script mark this head errored even if its first PR lookup fails.
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bash .github/review-gate.sh "$PR"

  # The queue's commit: carry over the result the PR earned on its own head. Runs main's script, like the gate.
  queue:
    if: vars.ACTIONS_ENABLED == 'true' && github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/review-gate-queue.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set review-gate on the merge group commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        run: bash .github/review-gate-queue.sh

  # A PR the gate just passed, with nothing risky: may it merge on its own? Watch-only unless AUTO_MERGE is `arm`.
  auto-merge:
    needs: gate
    if: >-
      vars.ACTIONS_ENABLED == 'true' && needs.gate.outputs.state == 'success' && needs.gate.outputs.risky == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/review-gate-arm.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Only in arm mode: the merge app's token, scoped to this repository. Watch mode uses no secret.
      - name: Get the merge app's token
        id: app
        if: vars.AUTO_MERGE == 'arm'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Arm auto-merge, or report that it would
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          MODE: ${{ vars.AUTO_MERGE == 'arm' && 'arm' || 'watch' }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          HEAD: ${{ needs.gate.outputs.head }}
        run: bash .github/review-gate-arm.sh "$PR" "$HEAD"

  # The sweep and review events only dispatch a run per PR; that run lands in the PR's own concurrency group.
  dispatch:
    if: >-
      vars.ACTIONS_ENABLED == 'true' &&
      (github.event_name == 'schedule' || (github.event_name == 'pull_request_review' && !github.event.pull_request.draft))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Dispatch a review-gate run for each PR to check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.event.repository.default_branch }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          prs=$PR
          [ -n "$prs" ] || prs=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --paginate \
                                   --jq '.[] | select(.draft | not) | .number')
          for n in $prs; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/review-gate.yml/dispatches" \
              -f ref="$REF" -f "inputs[pr]=$n" || echo "::warning::could not dispatch review-gate for PR $n"
          done
