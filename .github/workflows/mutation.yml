# mutation: the nightly whole-project Stryker.NET run (T-236 row 5, owner ruling Q43 option 2).
#
# Every configured .NET test project on main, each held to the break recorded for it in
# eng/baselines/mutation-baseline.json (the floor of its measured score, raised as test-improvement
# tickets land). The api host is too big for one night (Q44): each night mutates the next slice of
# eng/baselines/mutation-slices.json (days since the epoch mod the slice count; silent-failure slices
# first). A slice still "pending" there has its score recorded, not enforced; a follow-up PR copies
# the score from this run's summary into the baselines file. A pull request is never held to that floor: verify.yml's `stryker` job reports the
# survivors on its changed lines instead. winbox only (macpro is the gate bottleneck; mac16 is the
# perf lane's). No pull_request trigger, so no fork code reaches the runner.
name: mutation

on:
  schedule:
    - cron: '0 7 * * *'   # 03:00 America/New_York in daylight time (02:00 in standard time)
  workflow_dispatch:
    inputs:
      slice:
        description: Host slice to run instead of tonight's (a name from eng/baselines/mutation-slices.json)
        required: false
        default: ''

concurrency:
  group: mutation
  cancel-in-progress: false

# No Actions cache capability is needed by mutation; applies to every job.
cache-mode: none

permissions:
  contents: read

jobs:
  workload-route:
    if: vars.ACTIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.route.outputs.enabled }}
      labels: ${{ steps.route.outputs.labels }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify cache capability isolation
        run: node .github/workloads/cache-isolation.mjs
      - name: Explain background routing
        id: route
        env:
          BACKGROUND_MUTATION_ROUTE: ${{ vars.BACKGROUND_MUTATION_ROUTE }}
          LOCAL_BACKGROUND_RESERVATION: ${{ vars.LOCAL_BACKGROUND_RESERVATION }}
        run: |
          node --test .github/workloads/workload-route.test.mjs .github/workloads/cache-isolation.test.mjs
          python3 .github/workloads/host-workload-lock.test.py
          node .github/workloads/workload-route.mjs
  stryker-full:
    needs: workload-route
    if: vars.ACTIONS_ENABLED == 'true' && needs.workload-route.outputs.enabled == 'true'
    runs-on: ${{ fromJSON(needs.workload-route.outputs.labels) }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      # vstest's 90 s default lapsed on a loaded winbox with eight Stryker runners (T-236 proof run).
      VSTEST_CONNECTION_TIMEOUT: '300'
    steps:
      - name: Git Bash on PATH for the service account
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'

      - uses: actions/checkout@v7
        with:
          clean: true
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verify cache capability isolation
        run: node .github/workloads/cache-isolation.mjs
      - name: Read the recorded platform pin
        id: platform_pin
        run: echo "commit=$(node -p "require('./eng/platform-pin.json').commit")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Harborline-Software/harborline-platform
          ref: ${{ steps.platform_pin.outputs.commit }}
          path: .platform
          persist-credentials: false
      - name: Reserved full mutation and isolated feed
        run: python .github/workloads/host-workload-lock.py -- bash .github/workloads/full-mutation.sh
        env:
          HARBORLINE_PLATFORM_REPO: ${{ github.workspace }}/.platform
          NUGET_PACKAGES: ${{ runner.temp }}/mutation-nuget-${{ github.run_id }}-${{ github.run_attempt }}
          SLICE: ${{ inputs.slice }}

      - name: Mutation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-full-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true  # the path is a dot-folder, which upload-artifact skips by default
          path: .stryker/*/reports/mutation-report.json
