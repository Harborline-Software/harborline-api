name: platform-feed-qualification
on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run three full cold/warm/forced-miss measurement pairs using disposable entries
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/platform-feed-qualification.yml'
      - 'eng/platform-feed-*.mjs'
      - 'eng/platform-feed-profile.json'
      - 'eng/build-local-feed.mjs'
      - 'eng/same-job-platform-feed.mjs'
      - 'eng/exact-clone-platform-feed.mjs'
      - 'eng/platform-pin.json'
permissions:
  contents: read
concurrency:
  group: platform-feed-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  qualify-linux-docker-node24:
    if: github.event_name != 'workflow_dispatch' || !inputs.benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Bound qualification diagnostics and preserve upload time
        run: echo "HARBORLINE_QUALIFICATION_DEADLINE_MS=$(( ($(date +%s) + 1800) * 1000 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read platform pin
        id: pin
        run: echo "commit=$(node -p "JSON.parse(require('fs').readFileSync('eng/platform-pin.json')).commit")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Harborline-Software/harborline-platform
          ref: ${{ steps.pin.outputs.commit }}
          path: .platform
          persist-credentials: false
          fetch-depth: 0
      - name: Qualify production builder and restored bytes
        run: node eng/platform-feed-qualification.mjs "$GITHUB_WORKSPACE/.platform"
      - name: Scoped qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-feed-qualification-${{ github.run_id }}
          if-no-files-found: error
          include-hidden-files: true # explicit bounded evidence JSON only
          path: .claude/platform-feed-qualification/evidence.json
  benchmark-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    cache-mode: write
    strategy:
      fail-fast: false
      matrix:
        pair: [1, 2, 3]
    env:
      BENCHMARK_PAIR: ${{ matrix.pair }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Start common setup clock
        run: echo "BENCHMARK_SETUP_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.1.3
      - name: Resolve platform pin
        id: pin
        run: echo "commit=$(node -p "JSON.parse(require('fs').readFileSync('eng/platform-pin.json')).commit")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Harborline-Software/harborline-platform
          ref: ${{ steps.pin.outputs.commit }}
          path: .platform
          persist-credentials: false
          fetch-depth: 0
      - name: Keep pinned dependency checkout outside candidate source inventory
        run: echo '.platform/' >> .git/info/exclude
      - name: Full fresh measurement cases
        uses: ./.github/actions/platform-feed-benchmark
        env:
          BENCHMARK_PLATFORM: ${{ github.workspace }}/.platform
      - name: Bounded measurement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-feed-benchmark-${{ github.run_id }}-${{ matrix.pair }}
          path: .claude/platform-feed-benchmark/evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
