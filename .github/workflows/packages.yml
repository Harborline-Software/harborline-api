name: packages

# ---------------------------------------------------------------------------
# ACTIONS_ENABLED - the switch for the OPTIONAL job in this workflow (publish).
#
# T-633: the three required contexts here (protocol-lane-conformance, operator-cli-headless,
# pack-consume) carry no variable condition (the two test jobs skip on `push` alone, which no
# setting can flip and which no pull request or merge group sees). GitHub counts a job skipped by
# its own `if` as a SUCCESSFUL required check, so while every job was guarded by
# `vars.ACTIONS_ENABLED == 'true'` deleting one repository variable turned every required context
# green without running anything, and the merge queue admitted whatever was in front of it. The variable was in fact unset from 2026-08-24 (free
# plan, private repositories, minutes exhausted) until the repositories went public on 2026-09-07.
#
# 2026-09-29 (owner, CI load): on a pull request the three required jobs skip a draft (as verify.yml's
# lanes do) and a PR labelled `stacked`, and so report skipped-as-green there. The merge group runs
# all three regardless, and it is the only way onto main, so no change lands without them.
#
# Verification does NOT depend on this flag. Run locally instead:
#     bash eng/verify.sh
#
# To switch the optional jobs, per repository:
#     gh variable set ACTIONS_ENABLED --body true
#     gh variable delete ACTIONS_ENABLED
# ---------------------------------------------------------------------------
on:
  pull_request:
    # ready_for_review: a draft skips the jobs below, so marking it ready must run them.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    # T-577: no push-to-main run; the merge group already proved the landing commit.
    # 2026-09-29 (owner, platform's T-579 rule): a push is publication only. It reruns no test: the
    # two source-test jobs below skip on push; pack-consume proves the freshly packed bytes, and publish refuses a commit that is
    # not on main (which the merge group proved).
    tags: ["v*-preview.*", "v*-alpha.*", "v*-beta.*", "v*-rc.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish prerelease packages to GitHub Packages
        type: boolean
        required: false
        default: false

# A new push to a pull request cancels that PR's in-flight run. A merge group keys on its own ref
# (unique per queue entry), and a tag push or dispatch on its run id, so none of them is ever cancelled
# or queued behind another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'merge_group' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  # The app/Capability protocol is schema-first: one JSON Schema plus manifest generates the
  # TypeScript, C#, Rust and OpenAPI projections, and a shared 48-case fixture manifest is the
  # language-neutral proof that every projection implements the same wire contract.
  #
  # Until this job existed, CI ran only `dotnet test` and verify-packages.sh -- no Node, no cargo.
  # So the lane that serves the API was gated but unmeasured against the contract, while the two
  # lanes that did measure it ran nowhere. A stale regeneration, or one projection drifting from
  # the schema, shipped green.
  #
  # Every step carries `if: ${{ !cancelled() }}` deliberately: when a schema change is only
  # half-regenerated the useful signal is WHICH lanes disagree, and fail-fast would report just
  # the first. One red lane reads as a broken projection; three red lanes read as a regeneration
  # that was never run.
  protocol-lane-conformance:
    # Skipped on push only (publication only, see `on:`). No variable can flip this condition, and a
    # push has no pull request or merge group for a skipped-as-green context to admit (T-633). On a
    # pull request it also skips a draft and a `stacked` PR (see the header); the merge group runs it.
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.labels.*.name, 'stacked')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: ./.github/actions/platform-feed
      - uses: actions/setup-node@v7
        with:
          # No engines field or .nvmrc pins this package; 24 is the version the lane is verified
          # against locally. Rust needs no setup step -- ubuntu-latest ships a stable toolchain
          # well past the 1.85 that Cargo.toml's edition 2024 requires.
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/contracts/pnpm-lock.yaml

      - name: Generated projections are in sync with the schema
        if: ${{ !cancelled() }}
        run: node tooling/harborline-contract-codegen/generate.mjs --check

      - name: Codegen guard suite (boundary inventory, emitter fail-open regressions)
        # --check above never runs validateInventory; this suite is the only executable gate on
        # boundary-inventory drift (ticket 081 wave-2 finding contracts-1). The wrapper fails
        # closed on an empty match and pins the three app-relocation failures by name.
        if: ${{ !cancelled() }}
        run: node tooling/harborline-contract-codegen/run-tests.mjs

      - name: TypeScript lane
        if: ${{ !cancelled() }}
        working-directory: packages/contracts
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - name: C# lane
        if: ${{ !cancelled() }}
        run: dotnet test packages/contracts/tests/Harborline.Contracts.Tests.csproj -c Release

      - name: Rust lane
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path packages/contracts/rust/Cargo.toml

  operator-cli-headless:
    # Skipped on push, a draft and a `stacked` PR, for the reasons protocol-lane-conformance gives.
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.labels.*.name, 'stacked')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: ./.github/actions/platform-feed
      - name: Drive a provisioned node through the operator CLI
        run: >-
          dotnet test apps/local-node-host/tests/tests.csproj
          -c Release
          --filter FullyQualifiedName~OperatorCliHeadlessEndToEndTests

  # 2026-09-29 (owner): build-and-test (the Ubuntu exact-clone against host-test-baseline.ubuntu.json)
  # moved to verify.yml as the verify-linux host lane, inside the required `verify` context.

  # Packs the three shipped projects and restores them into tests/package-consumer the way an
  # external consumer would. It does not wait on the host suite (verify.yml): proving the packed
  # nupkgs restore and run is independent evidence from the unit suite, and gating it behind the
  # suite is precisely what hid a restore-breaking NU1015 in Directory.Build.props.
  # Every event consumes the exact packed bytes; push skips the broader source checks.
  pack-consume:
    # A draft and a `stacked` PR skip it, as protocol-lane-conformance does; every other event runs it.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       !contains(github.event.pull_request.labels.*.name, 'stacked'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          # The three shipped packages and tests/package-consumer target net10.0, but global.json
          # pins an 11.0 preview SDK, which carries only the 11.0 runtime. Without a 10.0 runtime
          # the consumer restores and builds cleanly and then dies at `dotnet run` with "You must
          # install or update .NET ... version '10.0.0'", exit 150. Invisible on a dev box that
          # already has the 10.0 runtime installed, which is why it survived until this job first
          # ran on a clean machine. Verified on ubuntu: without this the job is red, with it green.
          dotnet-version: '10.0.x'
          global-json-file: global.json
      - uses: ./.github/actions/platform-feed
      - name: Select immutable prerelease version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            value="${GITHUB_REF_NAME#v}"
          else
            value="0.1.0-preview.${GITHUB_RUN_NUMBER}"
          fi
          if [[ "$value" != *-* ]]; then
            echo "Stable package publication is not authorized: $value" >&2
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Test package promotion guards
        run: python3 -m unittest discover -s eng/tests -p "test_package_proof.py"
      - name: Pack and verify clean consumer
        env:
          HARBORLINE_PACKAGE_PACK_ONLY: ${{ github.event_name == 'push' && '1' || '' }}
          HARBORLINE_PACKAGE_VERSION: ${{ steps.version.outputs.value }}
          HARBORLINE_PACKAGE_OUTPUT: ${{ github.workspace }}/artifacts/packages
        run: bash eng/verify-packages.sh
      # The npm contracts package rides the same artifact as the nupkgs, stamped with the same
      # immutable prerelease version, so one publish run ships one version across both registries.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/contracts/pnpm-lock.yaml
      - name: Pack the npm contracts package
        working-directory: packages/contracts
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm pack --pack-destination "${{ github.workspace }}/artifacts/packages"
      - name: Bind the distribution manifest to the successful consumer proof
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 eng/package-proof.py seal artifacts/packages "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: harborline-api-${{ steps.version.outputs.value }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.tgz
            artifacts/packages/consumer-proof.json
            artifacts/packages/package-manifest.json
          if-no-files-found: error
  # Publication does not rerun the source suite. It accepts only commits on main and the exact
  # NuGet bytes consumed in this run. The npm tarball is identity/hash checked, not consumer-tested.
  # The source/run-bound receipt and distribution manifest are checked after artifact transfer.
  publish:
    needs: [pack-consume]
    if: >-
      vars.ACTIONS_ENABLED == 'true'
      && (startsWith(github.ref, 'refs/tags/') || inputs.publish == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish only what main landed
        # The merge queue is the only way onto main, so a commit main contains was proved in its
        # merge group. Anything else (a tag or dispatch on an unmerged branch) was never tested.
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_SHA is not on main; publication ships only merge-group-proved commits"
            exit 1
          }
      - uses: actions/setup-dotnet@v6
        with:
          # Required even though nothing is compiled here: global.json pins a preview SDK with
          # rollForward disabled, so any dotnet command run in the repo fails without it.
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: harborline-api-${{ needs.pack-consume.outputs.version }}
          path: artifacts/packages
      - name: Verify transferred package bytes and consumer proof
        env:
          VERSION: ${{ needs.pack-consume.outputs.version }}
        run: python3 eng/package-proof.py verify artifacts/packages "$VERSION"
      - name: Require explicit distribution authority
        shell: bash
        run: |
          authority="$(jq -r '.packageDistributionAuthority // empty' repository.yaml)"
          remote_status="$(jq -r '.remote.status // empty' repository.yaml)"
          if [[ -z "$authority" || "$remote_status" != "active" ]]; then
            echo "Publication requires an active remote and named packageDistributionAuthority in repository.yaml." >&2
            exit 1
          fi
      - name: Publish to GitHub Packages
        env:
          VERSION: ${{ needs.pack-consume.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget add source \
            --username "${GITHUB_ACTOR}" \
            --password "${GH_TOKEN}" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json"
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source github \
            --api-key "${GH_TOKEN}" \
            --skip-duplicate
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@harborline-software'
      - name: Publish the npm contracts package to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tgz in artifacts/packages/*.tgz; do
            npm publish "$tgz" --access restricted
          done
