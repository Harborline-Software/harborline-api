name: Pinned platform feed
description: Build and validate the local NuGet source before restoring API projects
inputs:
  cross-run-reuse:
    description: Attempt verified Linux dependency artifact reuse, otherwise build freshly
    default: 'false'
  same-job-handoff:
    description: Explicitly prepare complete dependency bytes for this job's fresh exact-clone consumer
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Pin runner interpreters before candidate tests
      id: feed_tools
      shell: bash
      env:
        CROSS_RUN_REUSE: ${{ inputs.cross-run-reuse }}
        NODE_OPTIONS: ''
        NODE_PATH: ''
        NODE_REPL_EXTERNAL_MODULE: ''
        LD_PRELOAD: ''
        LD_LIBRARY_PATH: ''
        DYLD_INSERT_LIBRARIES: ''
        DYLD_LIBRARY_PATH: ''
        DYLD_FRAMEWORK_PATH: ''
        DYLD_FALLBACK_LIBRARY_PATH: ''
        DYLD_FALLBACK_FRAMEWORK_PATH: ''
        BASH_ENV: ''
        ENV: ''
      run: |
        unset NODE_OPTIONS NODE_PATH NODE_REPL_EXTERNAL_MODULE LD_PRELOAD LD_LIBRARY_PATH DYLD_INSERT_LIBRARIES DYLD_LIBRARY_PATH DYLD_FRAMEWORK_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_FALLBACK_FRAMEWORK_PATH BASH_ENV ENV
        node_path=$(node -p 'process.execPath')
        printf 'node=%s\n' "$node_path" >> "$GITHUB_OUTPUT"
        if [[ "$CROSS_RUN_REUSE" == 'true' ]]; then
          [[ "$RUNNER_OS" == 'Linux' ]] || exit 1
          python_path=$(readlink -f "$(command -v python3)")
          [[ "$python_path" == /* && -x "$python_path" ]] || exit 1
          printf 'python=%s\n' "$python_path" >> "$GITHUB_OUTPUT"
        fi
    - name: Read the recorded platform pin
      id: platform_pin
      shell: bash
      run: echo "commit=$(jq -r '.commit' eng/platform-pin.json)" >> "$GITHUB_OUTPUT"
    - name: Check out the pinned platform
      uses: actions/checkout@v7
      with:
        repository: Harborline-Software/harborline-platform
        ref: ${{ steps.platform_pin.outputs.commit }}
        path: .platform
        fetch-depth: ${{ inputs.cross-run-reuse == 'true' && '0' || '1' }}
        persist-credentials: false
    # Complete authentication before candidate tests can modify runner environment.
    - name: Prepare authenticated dependency reuse before candidate code
      id: feed_reuse
      if: inputs.cross-run-reuse == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NODE_OPTIONS: ''
        NODE_PATH: ''
        NODE_REPL_EXTERNAL_MODULE: ''
        LD_PRELOAD: ''
        LD_LIBRARY_PATH: ''
        DYLD_INSERT_LIBRARIES: ''
        DYLD_LIBRARY_PATH: ''
        DYLD_FRAMEWORK_PATH: ''
        DYLD_FALLBACK_LIBRARY_PATH: ''
        DYLD_FALLBACK_FRAMEWORK_PATH: ''
        BASH_ENV: ''
        ENV: ''
        TRUSTED_FEED_ACTION_PATH: ${{ github.action_path }}
        TRUSTED_FEED_ACTION_REPOSITORY: ${{ github.action_repository }}
        TRUSTED_FEED_ACTION_REF: ${{ github.action_ref }}
        FEED_NODE: ${{ steps.feed_tools.outputs.node }}
        HARBORLINE_FEED_PYTHON: ${{ steps.feed_tools.outputs.python }}
        HARBORLINE_PLATFORM_REPO: ${{ github.workspace }}/.platform
      run: |
        unset NODE_OPTIONS NODE_PATH NODE_REPL_EXTERNAL_MODULE LD_PRELOAD LD_LIBRARY_PATH DYLD_INSERT_LIBRARIES DYLD_LIBRARY_PATH DYLD_FRAMEWORK_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_FALLBACK_FRAMEWORK_PATH BASH_ENV ENV
        [[ "$TRUSTED_FEED_ACTION_REPOSITORY" == 'Harborline-Software/harborline-api' && "$TRUSTED_FEED_ACTION_REF" == 'main' ]] || exit 1
        trusted_root=$(cd "$TRUSTED_FEED_ACTION_PATH/../../.." && pwd -P)
        [[ "$trusted_root" != "$GITHUB_WORKSPACE" ]] || exit 1
        if "$FEED_NODE" "$trusted_root/eng/platform-feed-consumer-launch.mjs" "$HARBORLINE_PLATFORM_REPO" "$GITHUB_WORKSPACE"; then
          echo 'reused=true' >> "$GITHUB_OUTPUT"
        else
          echo 'reused=false' >> "$GITHUB_OUTPUT"
        fi
    - name: Test the feed contract
      shell: bash
      env:
        FEED_NODE: ${{ steps.feed_tools.outputs.node }}
      run: |
        if ! "$FEED_NODE" --test eng/tests/platform-feed.test.mjs eng/tests/platform-feed-reuse.test.mjs; then
          echo "::error title=platform-feed test failed::eng/tests/platform-feed.test.mjs failed; the feed build did not run"
          exit 1
        fi
    - name: Build the local package feed
      shell: bash
      env:
        HARBORLINE_PLATFORM_REPO: ${{ github.workspace }}/.platform
        SAME_JOB_HANDOFF: ${{ inputs.same-job-handoff }}
        CROSS_RUN_REUSE: ${{ inputs.cross-run-reuse }}
        FEED_NODE: ${{ steps.feed_tools.outputs.node }}
        FEED_REUSED: ${{ steps.feed_reuse.outputs.reused }}
      run: |
        if [[ "$SAME_JOB_HANDOFF" != 'true' && "$SAME_JOB_HANDOFF" != 'false' ]]; then
          echo '::error::same-job-handoff must be true or false'
          exit 1
        fi
        if [[ "$CROSS_RUN_REUSE" == 'true' ]]; then
          if [[ "$FEED_REUSED" == 'true' ]]; then
            exit 0 # only feed preparation completed; the subsequent API gate still runs
          fi
        elif [[ "$CROSS_RUN_REUSE" != 'false' ]]; then
          echo '::error::cross-run-reuse must be true or false'
          exit 1
        fi
        # Metadata authentication ends here; build tasks receive no broker token.
        unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_ENTERPRISE_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
        if [[ "$SAME_JOB_HANDOFF" == 'true' ]]; then
          "$FEED_NODE" eng/same-job-platform-feed.mjs build "$HARBORLINE_PLATFORM_REPO"
        else
          "$FEED_NODE" eng/build-local-feed.mjs
        fi
