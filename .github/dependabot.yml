version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    # The .NET package set moves together (EF Core must match the Npgsql provider: NU1107/NU1608), so it updates
    # as one `dotnet` group. With .NET 11 GA (R-0183) the previews no longer move by hand (ticket 243); a new
    # major (the next .NET release) still does, so majors of this set are ignored here.
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*", "Npgsql.*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/packages/contracts"
    # T-720: vitest stays on 4.x to match capability-host and the StrykerJS 10 vitest runner, which completed
    # zero tests per mutant on vitest 5.0.1. Re-vet the major (ADR-0084) when StrykerJS supports vitest 5.
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directory: "/packages/contracts/rust"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
